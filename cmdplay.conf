# cmdplay 設定檔。預設位置 ~/.config/cmdplay/cmdplay.conf，或用 -s 指定。
# 行內註解要用空白隔開的 # 或 ;。

[output]
# ALSA 裝置名稱：alsa_cdsp 定義的 PCM、hw:、plughw:、pipewire、pulse、default...
device = camilladsp
# 額外的 ALSA 設定檔，和系統設定合併；相對路徑以本檔所在目錄為準。
alsa_conf = asound_cmdplay.conf

# native: 照檔案的位元深度輸出 (16 bit -> S16_LE，24/32 bit -> S32_LE，
#         float -> FLOAT_LE)。位元深度改變時要重開裝置 (CamillaDSP 重啟)。
# S32_LE: 一律輸出 32 bit (無損)，同取樣率的 16/24 bit 曲目可以無縫連播。
sample_format = S32_LE

# ALSA 緩衝與週期 (毫秒)
buffer_time = 500
period_time = 100

# 裝置聲道數，0 = 跟檔案一樣 (單聲道會複製成雙聲道)。
channels = 0
# 裝置聲道對應來源聲道，- 為靜音。例:直接送 RME 16 聲道 hw 裝置時
#   channels = 16
#   channel_map = 0 1 - - - - - - - - - - - - - -
#channel_map = 

# 取樣率不合時是否讓 ALSA 重新取樣。關閉時裝置不支援的取樣率會跳過該曲。
allow_resample = no

# 裝置之後還留著的聲音 (例如 CamillaDSP 內部的緩衝)，用來算出「正在聽到」
# 的位置，讓暫停後從聽到的地方接著播。可寫毫秒 (370 / 370 ms) 或 frames。
# hd820_cdsp.yml : chunksize 8192 + target_level 8192
latency = 16384 frames

[player]
# 格式相同的下一首直接接上，不重開裝置。
gapless = yes
# reopen: 暫停時關掉裝置 (CamillaDSP 結束)，繼續時從暫停處重開。
# device: 用 ALSA 的 pause (裝置不支援時自動改用 reopen)。
pause_mode = reopen
# 左右鍵與上下鍵的跳轉秒數
seek_step = 10
seek_step_long = 60
# 是否讀鍵盤 (同 --no-keys)
keys = yes
# 不是 UTF-8 的 CUE 依序嘗試的編碼
text_encodings = BIG5,GB18030,SHIFT_JIS

# 播放前把整個檔案讀進記憶體，播放時不再讀磁碟。下一首會在目前這首播放時
# 於背景先讀好，所以換曲 (包括無縫連播) 不用等。記憶體裡最多同時有目前和
# 下一個檔案。
preload = yes
# 超過這個大小 (MB) 的檔案不預載，照常從磁碟邊讀邊播。
preload_max = 4096